[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The PyPI *distribution* name. The short `vibeguard` name on PyPI belongs to
# an unrelated project by a different author, so the distribution carries a
# `-py` suffix. The repo name, the importable module and the `vibeguard`
# console script are unchanged.
name = "vibeguard-py"
version = "0.1.0"
description = "Security scanner for AI-generated code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"},
]
keywords = ["security", "scanner", "ai", "vibe-coding", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
vibeguard = "vibeguard.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/vibeguard"
Issues = "https://github.com/yunaremaia/vibeguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeguard"]

[tool.pytest.ini_options]
# The real suite lives in tests/. The repository-root file test_vulnerable_app.py
# is a *fixture*: it intentionally contains vulnerable code for manual scanner
# demos and defines no test functions, so it must not be collected.
testpaths = ["tests"]

[tool.coverage.run]
# Measure the shipped package by path. This keeps the report scoped to real
# project code, so the repository-root fixture app is never counted.
source = ["src/vibeguard"]
# Line coverage, deliberately. The ratchet below is a line-coverage number and
# must not silently change meaning if branch coverage is ever switched on.
branch = false

[tool.coverage.report]
# Ratchet, set at the value the suite actually measures: 100% (354/354
# statements). It is the real number, not a round figure to hide behind.
# Never lower it to make a run pass - add a test instead.
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    # Intentionally vulnerable sample app used to demo the scanner findings.
    # It is fixture data, not project code, so lint rules must not apply to it.
    "test_vulnerable_app.py",
]

[tool.ruff.lint]
# Explicit rule selection instead of relying on ruff's version-dependent
# defaults, so CI fails for the same reasons on every run. The set covers
# correctness (E, F, B), import hygiene (I), modernisation (UP, PIE) and
# security (S) - the last one matters most for a security scanner.
select = ["E", "F", "B", "I", "UP", "PIE", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately inspect test files and re-raise whatever they catch.
"tests/*" = ["S101"]
