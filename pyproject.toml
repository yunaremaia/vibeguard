[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeguard"
version = "0.1.0"
description = "Security scanner for AI-generated code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"},
]
keywords = ["security", "scanner", "ai", "vibe-coding", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
vibeguard = "vibeguard.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/vibeguard"
Issues = "https://github.com/yunaremaia/vibeguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeguard"]
