name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes do not queue up
# redundant jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Matches the versions declared in the pyproject.toml classifiers.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov

      # The gate itself lives in pyproject.toml ([tool.coverage.report]
      # fail_under). pytest-cov enforces it, so a coverage drop fails the job.
      - name: Run test suite with coverage gate
        run: >-
          python -m pytest -v
          --cov=src/vibeguard
          --cov-report=term-missing

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check .